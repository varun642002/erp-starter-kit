<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>No connection</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 1.25rem 0 0.25rem; }
      p { margin: 0.25rem 0; color: #475569; }
      button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 0.75rem; background: #2563eb; color: #fff; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } p { color: #94a3b8; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ERP Starter" />
      <h1>No internet connection</h1>
      <p>The ERP needs the internet to show your latest stock and sales. Check your connection and try again.</p>
      <p lang="ta">இணைய இணைப்பு இல்லை. இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
